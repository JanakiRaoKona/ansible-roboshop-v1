- name:  Configure the Shipping server 
  hosts: shipping 
  become: yes 
  tasks:
    - name:  enable maven 3.9 
      command: dnf module enable maven:3.9 -y

    - name: Install java 25 and maven
      dnf: 
        name: 
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25 # if install this no need to set JAVA_HOME
        state: present


    # - name: find java25 path
    #   shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -1)
    #   register: java25

    # - name: print the output
    #   debug:
    #     msg: "{{ java25 }}"

    # - name: make java25 as default
    #   command: alternatives --set java {{ java25.stdout }}

    # - name: set JAVA_HOME
    #   copy:
    #     content: "export JAVA_HOME={{ java25.stdout | dirname | dirname  }}"
    #     dest: /etc/profile.d/java.sh

    - name: Create a user 'roboshop' with a /app directory
      ansible.builtin.user:
        name: roboshop
        create_home: false 
        home: /app
        system: true 
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing shipping zip
      ansible.builtin.file:
        path: /tmp/shipping.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download shipping application 
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name:  unzip the file 
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes
    
    - name: install dependencies 
      command: mvn clean package
      args:
        chdir: /app 

    


    - name: daemon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and restart the shipping service 
      ansible.builtin.service:
        name: shipping
        state: restarted
        enabled: yes
