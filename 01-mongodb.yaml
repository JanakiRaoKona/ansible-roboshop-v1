- name:  Configure the mongodb server 
  hosts: mongodb
  become: yes
  tasks:
    - name: Copy the mongodb module 
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
    # - name:  test the mongodb file 
    #   debug:
    #     msg: "{{ app_name }}"

    - name:  Install mongodb 
      ansible.builtin.package:
        name: mongodb-org
        state: started

    - name: Enable and start the mongodb service 
      ansible.builtin.service:
        name: mongodb-org
        state: started
        enabled: yes

    - name: Allow remote connection
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'