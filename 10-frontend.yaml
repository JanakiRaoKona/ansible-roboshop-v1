- name:  Configure frontend sever
  hosts: frontend
  become: yes 
  tasks: 
    - name: disable nginx 
      command: dnf module disable nginx -y 

    - name: install nginx 
      ansible.builtin.package:
        name: nginx
        state: present

    - name: start and enable nginx 
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: Find all contents inside the directory
      ansible.builtin.find:
        paths: /usr/share/nginx/html/*
        recurse: yes
        hidden: yes  # Ensures hidden files (.dotfiles) are caught
        file_type: any
      register: files_to_delete

    - name: print the content in path 
      debug:
        msg: "{{ files_to_delete }}"

    - name: Remove all found contents
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"

    