- name:  Configure payment service 
  hosts: local 
  become: yes 
  tasks:
    - name:  install python 3.14 & 3.14 pip 
      dnf: 
        name: 
          - python3.14
          - python3.14-pip
        state: present

    - name: Create a user 'roboshop' with a /app directory
      ansible.builtin.user:
        name: roboshop
        create_home: false 
        home: /app
        system: true 
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing payment zip
      ansible.builtin.file:
        path: /tmp/payment.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download payment application 
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
        dest: /tmp/payment.zip

    - name:  unzip the file 
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: Install bottle into the specified (virtualenv), using Python 3.14
      ansible.builtin.pip:
        requirements: /app/requirements.txt
        virtualenv: /app/.venv
        virtualenv_command: python3.14 -m venv 

    - name: Copy payment service
      ansible.builtin.template:
        src: payment.service.j2
        dest: /etc/systemd/system/payment.service  
        
