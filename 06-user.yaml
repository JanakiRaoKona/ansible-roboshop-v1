- name: Configure user server 
  hosts: user
  become: yes 
  tasks:
    - name: disable the nodejs
      command: dnf module disable nodejs -y
    
    - name: enable nodejs 24 
      command: dnf module enable nodejs:24 -y
    
    - name: Install nodejs
      ansible.builtin.dnf:
        name: nodejs 
        state: present 

    - name: Create a user 'roboshop' with a /app directory
      ansible.builtin.user:
        name: roboshop
        create_home: false 
        home: /app
        system: true 
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing user zip
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download user application 
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
        dest: /tmp/user.zip

    - name:  unzip the file 
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: Install npm packages
      community.general.npm:
        path: /app
        state: present

    - name: Copy user service
      ansible.builtin.template:
        src: user.service.j2
        dest: /etc/systemd/system/user.service

    - name: daemon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and restart the user service 
      ansible.builtin.service:
        name: user
        state: restarted
        enabled: yes
