- name: Configure catalogue server 
  hosts: catalogue
  become: yes 
  tasks:
    - name: disable the nodejs
      command: dnf module disable nodejs -y
    
    - name: enable nodejs 24 
      command: dnf module enable nodejs:24 -y

    # - name:  enable nodejs 24  
    #   ansible.builtin.service:
    #     name: nodejs:24
    #     enabled: yes   //  not availale module 
    
    - name: Install nodejs
      ansible.builtin.dnf:
        name: nodejs 
        state: present 

    - name: Create a user 'roboshop' with a /app directory
      ansible.builtin.user:
        name: roboshop
        create_home: false 
        home: /app
        system: true 
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing catalogue zip
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download catalogue application 
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name:  unzip the file 
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Install npm packages
      community.general.npm:
        path: /app
        state: present

    - name: Copy catalogue service
      ansible.builtin.template:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    
    - name: Copy mongo repo 
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name:  Install mongodb client
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present

    - name: Check products loaded or not 
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count
     

    - name: Print product count 
      debug:
        msg: "{{ product_count }}"


    
    