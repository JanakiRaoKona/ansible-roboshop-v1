- name: Create Ec2 instances and Route53 records 
  hosts: local 
  connection: local
  vars:
    instances: ["mongodb", "redis" , "mysql", "rabbitmq"]
    action: create 
    domain_name: janakiraodevops.online 
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
  tasks:
    - name: Create Ec2 instance 
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ image_id }}"
        instance_type: "{{ instance_type }}"
        region: us-east-1
        security_groups:
          - roboshop-comman
          - "roboshop-{{ item }}" 
      loop: "{{ instances }}"
      when: action == "create"
  
    

  
  
