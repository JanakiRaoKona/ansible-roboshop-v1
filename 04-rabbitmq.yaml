- name: Configure the rabbitmq 
  hosts: rabbitmq 
  become: yes 
  tasks: 
    - name: Copy the rabbit module 
      ansible.builtin.copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo
    
    - name: Install rabbitmq
      ansible.builtin.dnf:
        name: 
          - erlang 
          - rabbitmq-server
        state: present 
    
    - name: Enable and start the rabbitmq service 
      ansible.builtin.service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Create rabbitmq user 
      community.rabbitmq.rabbitmq_user:
        user: roboshop 
        password: roboshop123
        vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present