- name:  Configure the redis server 
  hosts: redis
  become: yes
  tasks:
    - name: disbale redis 
      command: dnf module disable redis -y

    - name: Enable redis service 
      ansible.builtin.service:
        name: redis:7 
        enabled: yes

    - name:  Install redis 
      ansible.builtin.package:
        name: redis 
        state: present

    - name: Allow remote connection
      ansible.builtin.replace:
        path: /etc/redis/redis.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'

    - name: disable the protected mode 
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^#?protected-mode yes'
        line: 'protected-mode no'
        state: present

    - name: Enable and start the redis service 
      ansible.builtin.service:
        name: redis
        state: started
        enabled: yes