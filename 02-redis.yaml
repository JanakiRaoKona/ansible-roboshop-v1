- name:  Configure the redis server 
  hosts: redis
  become: yes
  tasks:
    - name: disbale redis 
      command: dnf module disable redis -y

    - name: Enable redis service 
      ansible.builtin.service:
        name: redis 
        enabled: yes
        
    - name:  Install redis 
      ansible.builtin.package:
        name: redis 
        state: present